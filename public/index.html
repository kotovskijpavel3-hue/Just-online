<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07070c">
<title>Just Online — живые курсоры</title>
<meta name="description" content="Комната, где все курсоры видны вживую, а комментарии висят прямо над ними.">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='%238b7bff'/></svg>">
</head>
<body>

<div class="bg" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
</div>
<div class="grid" aria-hidden="true"></div>

<header class="bar">
  <div class="brand">
    <span class="logo" aria-hidden="true"><i></i></span>
    <div class="brand-text">
      <h1>Just Online</h1>
      <p>курсоры и мысли в реальном времени</p>
    </div>
  </div>

  <div class="bar-right">
    <span class="pill live"><span class="live-dot"></span><b id="online">1</b> онлайн</span>
    <label class="pill name-edit" title="Твоё имя видят все">
      <span>ты</span>
      <input id="name" maxlength="28" spellcheck="false" autocomplete="off" aria-label="Твоё имя">
    </label>
    <button id="share" class="pill btn" type="button">Скопировать ссылку</button>
  </div>
</header>

<main id="stage" class="stage">
  <div id="empty" class="empty">
    <h2>Ты пока один</h2>
    <p>Скинь ссылку другу — его курсор появится здесь вживую, вместе с комментариями.</p>
    <button id="share2" class="ghost-btn" type="button">Скопировать ссылку</button>
  </div>
</main>

<footer class="composer">
  <div class="field">
    <input id="comment" maxlength="240" autocomplete="off" spellcheck="false"
           placeholder="Напиши комментарий — он повиснет над твоим курсором">
    <span class="keys"><kbd>Enter</kbd> повесить <kbd>Esc</kbd> убрать</span>
  </div>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
